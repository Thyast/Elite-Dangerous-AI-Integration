<figure>
    <figcaption>Placement preview</figcaption>
    <svg viewBox="0 0 640 360" role="img"
         aria-label="VR placement preview: orange forward-view frame with horizontal and vertical center axes, and blue overlay window.">
        <g class="reference">
            <rect x="1" y="1" width="638" height="358" />
            <line x1="1" y1="180" x2="639" y2="180" />
            <line x1="320" y1="1" x2="320" y2="359" />
        </g>
        <polygon class="overlay-window" [attr.points]="overlayPoints" />
        @if (reducedOverlayPoints; as reducedPoints) {
            <polygon class="reduced-window" [attr.points]="reducedPoints">
                <title>{{ 'vrInterface.reducedFrame' | translate: { factor: config.overlay_vr_gaze_reduction_factor } }}</title>
            </polygon>
        }
    </svg>
    <div class="legend">
        <span class="reference-key">Forward view</span>
        <span class="window-key">Overlay window</span>
        @if (reducedOverlayPoints) {
            <span class="reduced-key">{{ 'vrInterface.reducedFrame' | translate: { factor: config.overlay_vr_gaze_reduction_factor } }}</span>
        }
    </div>
</figure>
